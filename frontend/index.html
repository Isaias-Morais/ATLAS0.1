<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Atlas</title>

    <script type="module" src="./js/script.js"></script>

    <link
            rel="stylesheet"
            href="./css/style.css"
    >
</head>

<body>

<header class="header">
    <div class="header__brand">
        <h1>ATLAS</h1>
    </div>

    <div class="header__datetime">
        <time id="current-time">00:00</time>
        <p id="current-date">Data</p>
    </div>

    </div>
</header>


<main class="main">

    <section class="assistant">

        <img
                src="./img/circuloIA.png"
                width="200"
                height="200"
                alt="Interface visual do Atlas"
        >

        <p id="assistant-message">
            Como posso ajudar?
        </p>
    </section>


    <section class="voice-control">
        <button id="listen-button" type="button">
            Pronto para ouvir
        </button>
    </section>


    <section class="dashboard">

        <article class="card card--reminders">
            <h3>Lembretes</h3>

            <p id="reminder-text">
                Nenhum lembrete
            </p>

            <time id="reminder-time">
                --
            </time>
        </article>


        <article class="card card--music">
            <h3>Música</h3>

                <div id="music-player">
                    Nenhuma música tocando
                </div>
            </article>

        </article>


        <article class="card card--alarm">
            <h3>Alarme</h3>

            <p id="next-alarm">
                Nenhum alarme
            </p>

            <time id="alarm-time">
                --
            </time>
        </article>

    </section>

</main>


<footer class="footer">
</footer>

</body>
</html>
